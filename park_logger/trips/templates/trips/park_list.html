{% extends 'base.html' %}
{% load static %}

{% block title %}All Parks - Park Logger{% endblock %}

{% block content %}
    <h1>Parks</h1>
    <a href="{% url 'trips:trip_add' %}" class="btn btn-primary mb-1">Log a New Trip</a>
    <ul>
        {% for park in parks %}
            <li><a href="{% url 'trips:park_detail' park.pk %}">{{ park.name }}</a></li>
        {% empty %}
            <li>No parks have been added yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
