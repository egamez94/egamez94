{% extends 'base.html' %}
{% load static %}

{% block title %}All Parks - Park Logger{% endblock %}

{% block content %}
    <h1 class="page-title">Parks</h1>
    <a href="{% url 'trips:trip_add' %}" class="btn btn-cta mb-1"><span>+</span> Log a New Trip</a>
    
    {% if parks %}
        <ul>
            {% for park in parks %}
                <li><a href="{% url 'trips:park_detail' park.pk %}">{{ park.name }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="empty-state">
            <span class="empty-state-icon">&#127795;</span> <!-- Unicode tree icon -->
            <p>No parks have been added yet.</p>
        </div>
    {% endif %}
{% endblock %}
