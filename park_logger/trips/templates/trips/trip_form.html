{% extends 'base.html' %}
{% load static %}

{% block title %}Log New Trip - Park Logger{% endblock %}

{% block content %}
    <h1>Log a New Trip</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Trip</button>
    </form>
    <br>
    <a href="{% url 'trips:park_list' %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
